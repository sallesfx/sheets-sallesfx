<!DOCTYPE html>
<html class="dark" lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>sallesfx / sheets - Configurar Wallpaper</title>

    <!-- Tailwind CSS & Fontes -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet" />

    <!-- Configuração do Tailwind Theme -->
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "dev-base": "#0f111a",
                        "dev-surface": "#1a1d2d",
                        "dev-border": "#2e334d",
                        "dev-primary": "#3b82f6",
                        "on-surface": "#e1e2ec",
                        "on-surface-variant": "#c2c6d6"
                    },
                    fontFamily: {
                        "mono": ["JetBrains Mono", "monospace"],
                        "sans": ["Inter", "sans-serif"]
                    },
                    boxShadow: {
                        'glow-primary': '0 0 15px rgba(59, 130, 246, 0.15)',
                        'glow-primary-hover': '0 0 25px rgba(59, 130, 246, 0.3)',
                    }
                }
            }
        }
    </script>

    <!-- Estilos Customizados e Suporte a Temas dos Wallpapers -->
    <link rel="stylesheet" href="public/assets/css/theme.css">

    <style>
        body {
            background-color: #0f111a;
            color: #e1e2ec;
        }

        .dot-bg {
            background-size: 20px 20px;
            background-image: radial-gradient(circle, #2e334d 1px, transparent 1px);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0f111a;
        }

        ::-webkit-scrollbar-thumb {
            background: #2e334d;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #424754;
        }
    </style>
</head>

<body class="min-h-screen flex flex-col font-sans text-sm overflow-hidden antialiased">

    <!-- TopNavBar -->
    <nav
        class="fixed top-0 w-full z-50 flex justify-between items-center px-6 h-16 bg-dev-base/80 backdrop-blur-md border-b border-dev-border">
        <div class="flex items-center gap-4">
            <a href="https://sallesfx.com.br"
                class="text-xl font-bold flex items-center hover:opacity-90 transition-opacity">
                <span class="text-on-surface">sallesfx</span>
                <span class="text-dev-primary ml-1">/ sheets</span>
            </a>
            <span
                class="text-xs font-mono bg-dev-primary/10 text-dev-primary px-2 py-0.5 rounded border border-dev-primary/20 uppercase">v1.0
                MVP</span>
        </div>

        <div class="flex items-center gap-4">
            <div class="hidden md:flex items-center gap-2 text-on-surface-variant text-xs font-mono">
                <span class="material-symbols-outlined text-[18px]">language</span>
                <span>PT-BR</span>
            </div>
            <a href="https://github.com/sallesfx/sheets-sallesfx" target="_blank"
                class="flex items-center gap-2 px-3 py-1.5 border border-dev-border rounded text-xs font-mono text-dev-primary hover:bg-white/5 transition-colors group">
                <span class="uppercase">Ver no GitHub</span>
                <span
                    class="material-symbols-outlined text-[16px] group-hover:translate-x-1 transition-transform">arrow_forward</span>
            </a>
        </div>
    </nav>

    <!-- Main Layout -->
    <main class="flex-1 flex mt-16 h-[calc(100vh-64px)] w-full max-w-[1440px] mx-auto">

        <!-- Painel Lateral Esquerdo (Configurações) -->
        <aside
            class="w-[320px] h-full bg-dev-surface border-r border-dev-border flex flex-col shrink-0 overflow-y-auto">
            <div class="p-6 border-b border-dev-border">
                <h1 class="text-lg font-semibold text-on-surface mb-1">Configuração</h1>
                <p class="text-xs text-on-surface-variant">Personalize seu wallpaper técnico</p>
            </div>

            <div class="p-6 flex flex-col gap-6 flex-1">

                <!-- 1. Categoria -->
                <div class="flex flex-col gap-2">
                    <label for="category" class="text-xs font-mono text-on-surface-variant flex items-center gap-2">
                        <span class="material-symbols-outlined text-[16px]">category</span>
                        1. CATEGORIA
                    </label>
                    <div class="relative">
                        <select id="category"
                            class="w-full bg-dev-base border border-dev-border rounded font-mono text-xs text-on-surface py-2.5 px-3 appearance-none focus:border-dev-primary focus:ring-1 focus:ring-dev-primary outline-none transition-colors cursor-pointer">
                            <option value="linux">Linux Terminal</option>
                            <option value="git" disabled>Git & GitHub (Em breve)</option>
                            <option value="docker" disabled>Docker & Containers (Em breve)</option>
                        </select>
                        <span
                            class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
                    </div>
                </div>

                <!-- 2. Conteúdo -->
                <div class="flex flex-col gap-2">
                    <label for="subcategory" class="text-xs font-mono text-on-surface-variant flex items-center gap-2">
                        <span class="material-symbols-outlined text-[16px]">description</span>
                        2. CONTEÚDO
                    </label>
                    <div class="relative">
                        <select id="subcategory"
                            class="w-full bg-dev-base border border-dev-border rounded font-mono text-xs text-on-surface py-2.5 px-3 appearance-none focus:border-dev-primary focus:ring-1 focus:ring-dev-primary outline-none transition-colors cursor-pointer">
                            <option value="navegacao">Navegação e Arquivos</option>
                            <option value="redes" disabled>Administração de Redes</option>
                            <option value="processos" disabled>Gerenciamento do Sistema</option>
                        </select>
                        <span
                            class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
                    </div>
                </div>

                <!-- 3. Tema Visual -->
                <div class="flex flex-col gap-2">
                    <label for="theme" class="text-xs font-mono text-on-surface-variant flex items-center gap-2">
                        <span class="material-symbols-outlined text-[16px]">palette</span>
                        3. TEMA VISUAL
                    </label>
                    <div class="relative">
                        <select id="theme"
                            class="w-full bg-dev-base border border-dev-border rounded font-mono text-xs text-on-surface py-2.5 px-3 appearance-none focus:border-dev-primary focus:ring-1 focus:ring-dev-primary outline-none transition-colors cursor-pointer">
                            <option value="catppuccin">Catppuccin Macchiato</option>
                            <option value="nord">Nord Theme</option>
                            <option value="dracula">Dracula Theme</option>
                        </select>
                        <span
                            class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
                    </div>
                </div>

                <!-- 4. Resolução -->
                <div class="flex flex-col gap-2">
                    <label for="resolution" class="text-xs font-mono text-on-surface-variant flex items-center gap-2">
                        <span class="material-symbols-outlined text-[16px]">aspect_ratio</span>
                        4. RESOLUÇÃO DE SAÍDA
                    </label>
                    <div class="relative">
                        <select id="resolution"
                            class="w-full bg-dev-base border border-dev-border rounded font-mono text-xs text-on-surface py-2.5 px-3 appearance-none focus:border-dev-primary focus:ring-1 focus:ring-dev-primary outline-none transition-colors cursor-pointer">
                            <option value="1080p">Full HD (1920x1080)</option>
                            <option value="2k">2K QHD (2560x1440)</option>
                            <option value="4k">4K UHD (3840x2160)</option>
                        </select>
                        <span
                            class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
                    </div>
                </div>

            </div>

            <!-- Botão de Ação / Exportação -->
            <div class="p-6 border-t border-dev-border mt-auto">
                <button id="btn-export"
                    class="w-full bg-dev-primary text-white font-mono text-xs py-3 px-4 rounded hover:shadow-glow-primary-hover hover:bg-blue-600 transition-all flex items-center justify-center gap-2 group uppercase font-semibold">
                    Baixar PNG em Alta Resolução
                    <span
                        class="material-symbols-outlined text-[18px] group-hover:translate-y-0.5 transition-transform">download</span>
                </button>
            </div>
        </aside>

        <!-- Canvas de Preview -->
        <section class="flex-1 relative flex flex-col bg-dev-base dot-bg overflow-hidden">
            <!-- Status Top Bar -->
            <div class="absolute top-0 w-full p-4 flex justify-between items-center z-10 pointer-events-none">
                <span
                    class="font-mono text-xs bg-dev-surface/90 backdrop-blur border border-dev-border text-on-surface px-3 py-1.5 rounded flex items-center gap-2 shadow-sm">
                    <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
                    Pré-visualização em Tempo Real
                </span>
                <span
                    class="font-mono text-xs bg-dev-surface/90 backdrop-blur border border-dev-border text-on-surface-variant px-3 py-1.5 rounded">
                    PROPORÇÃO 16:9
                </span>
            </div>

            <!-- Viewport Centralizada com Moldura do Wallpaper -->
            <div class="flex-1 flex items-center justify-center p-8 relative">
                <div id="wallpaper-preview"
                    class="wallpaper-frame w-full max-w-[960px] aspect-video rounded-xl border border-dev-border shadow-2xl relative overflow-hidden flex flex-col transition-transform duration-300 hover:scale-[1.01]"
                    data-theme="catppuccin">
                    <!-- O conteúdo HTML do template (templates/linux/navegacao.html) será injetado aqui dinamicamente pelo app.js -->
                </div>
            </div>
        </section>

    </main>

    <!-- Bibliotecas JS e Motor Core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="public/assets/js/app.js"></script>
</body>

</html>
